name: CI

# Build the app and run the test suite on every PR and push to main, so a
# change that breaks compilation or a test is caught before it merges.
#
# StealthPDF is a .NET Framework 4.8 WPF x64 app, so this must run on Windows.
# All build-required resources (embedded traineddata, icons, fonts, manifest)
# are tracked in git. The PyMuPDF PdfHelper bundle is NOT in git, but its build
# copy step is guarded by Condition="Exists(...)" in the csproj, so its absence
# does not fail the build. The TWAIN helper (x86) is built by the main project's
# CopyTwainHelperOutput target during the app build.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

# Cancel an in-progress run when the same PR/branch is pushed again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (net48, Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Restore the app and the (standalone) test project. The test project is
      # not part of StealthPDF.sln, so restore it explicitly.
      - name: Restore
        run: |
          dotnet restore StealthPDF.csproj
          dotnet restore StealthPDF.Tests/StealthPDF.Tests.csproj

      # Build the app in Release. This also builds the x86 TWAIN helper via the
      # main project's CopyTwainHelperOutput target.
      - name: Build app (Release)
        run: dotnet build StealthPDF.csproj -c Release --no-restore

      - name: Build tests (Release)
        run: dotnet build StealthPDF.Tests/StealthPDF.Tests.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet test StealthPDF.Tests/StealthPDF.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/*.trx
          if-no-files-found: ignore
