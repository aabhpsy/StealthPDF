name: Chocolatey Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.2)'
        required: true

jobs:
  push:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and push Chocolatey package
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $releaseTag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.tag }}" } else { "${{ github.event.release.tag_name }}" }
          $version = $releaseTag.TrimStart('v')
          # The release ships an installer and a portable ZIP; there is no bare StealthPDF.exe
          # asset any more. Chocolatey gets the installer, which carries the helper folders.
          $setupName = "StealthPDF-Setup-$version.exe"
          $exeUrl  = "https://github.com/aabhpsy/StealthPDF/releases/download/$releaseTag/$setupName"

          Write-Host "Downloading $exeUrl..."
          Invoke-WebRequest -Uri $exeUrl -OutFile "$env:RUNNER_TEMP\$setupName"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\$setupName" -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"

          # Stamp version and hash into package files
          $nuspec  = "choco\StealthPDF.nuspec"
          $install = "choco\tools\chocolateyInstall.ps1"

          (Get-Content $nuspec)  -replace 'REPLACE_VERSION', $version | Set-Content $nuspec
          (Get-Content $install) -replace 'REPLACE_HASH',    $hash    | Set-Content $install

          # Pack and push
          choco pack choco\StealthPDF.nuspec --out "$env:RUNNER_TEMP"
          choco push "$env:RUNNER_TEMP\StealthPDF.$version.nupkg" --source https://push.chocolatey.org --api-key $env:CHOCO_API_KEY
